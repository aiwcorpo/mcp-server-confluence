# Base configuration is the production one: mTLS from the gateway, internal JWT, jti store in Redis.
# Everything that differs per environment comes from environment variables (README, "Konfiguracja").
# The 'dev' profile (tests, see application-dev.yml) only turns off TLS; the remaining development
# relaxations come from TestGateway and the starter refuses them outside 'dev'.
server:
  port: ${MCP_PORT:8443}
  address: ${MCP_BIND:0.0.0.0}

spring:
  application:
    name: mcp-confluence
  data:
    redis:
      host: ${MCP_REDIS_HOST:localhost}
      port: ${MCP_REDIS_PORT:6379}
      username: ${MCP_REDIS_USER:mcp-confluence}
      password: ${MCP_REDIS_PASSWORD:}
  ai:
    mcp:
      server:
        # Transport (streamable HTTP, SYNC, endpoint /mcp) is defaulted by the starter.
        name: mcp-confluence
        version: '@project.version@'

aiwcorpo:
  mcp:
    platform:
      server-id: mcp-confluence
      internal-jwt:
        issuer: ${MCP_GATEWAY_ISSUER:https://mcp-gateway.internal}
        jwks-uri: ${MCP_GATEWAY_JWKS_URI:}
      credential:
        connect-url: ${MCP_CONNECT_URL:}
      # The signed policy bundle (C7), the same one the gateway evaluates. The server does not start without a first
      # bundle, and state-dir keeps the last accepted revision across restarts so an older signed bundle is refused.
      policy:
        main:
          url: ${MCP_POLICY_URL:}
          key-id: ${MCP_POLICY_KEY_ID:}
          public-key-file: ${MCP_POLICY_PUBLIC_KEY_FILE:}
        state-dir: ${MCP_POLICY_STATE_DIR:}
      # HMAC key of list cursors (Base64, at least 32 bytes). Every instance needs the same one; without it each process
      # draws its own, so a cursor does not survive a restart or a move to another instance.
      paging:
        cursor-key: ${MCP_CURSOR_KEY:}
      # Description of this server for the registry (GET /mcp-manifest, C6); the tool entries come from the code.
      manifest:
        version: '@project.version@'
        internal-url: ${MCP_INTERNAL_URL:}
        accepted-credential-types: ${MCP_ACCEPTED_CREDENTIAL_TYPES:user-secret}

confluence:
  backend:
    base-url: ${MCP_CONFLUENCE_URL:}
    ssl-bundle: ${MCP_CONFLUENCE_SSL_BUNDLE:}
    connect-timeout: 2s
    read-timeout: 10s
    max-response-size: 1MB
    # Plain http outside 'dev' only for the mocks of the dev stack; never in a real deployment.
    allow-plain-http: ${MCP_CONFLUENCE_ALLOW_PLAIN_HTTP:false}
    # Writes only on a release the version probe knows (8.5 up to 10.x). true also allows them when Confluence hides its
    # version or runs a newer one; the operator then answers for the behaviour of the REST API there.
    allow-writes-on-unknown-version: ${MCP_CONFLUENCE_WRITES_ON_UNKNOWN_VERSION:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: mcp-confluence

---
# TLS outside 'dev'. The server ends mTLS itself: the gateway must present a certificate of the internal CA
# (the starter also checks its CN), and the gateway checks this server's SAN mcp-confluence.internal.
spring:
  config:
    activate:
      on-profile: "!dev"
  ssl:
    bundle:
      jks:
        mcp-server:
          keystore:
            location: file:${MCP_TLS_KEYSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
          truststore:
            location: file:${MCP_TLS_TRUSTSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
        mcp-internal-ca:
          truststore:
            location: file:${MCP_TLS_TRUSTSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
server:
  ssl:
    bundle: mcp-server
    client-auth: need
aiwcorpo:
  mcp:
    platform:
      internal-jwt:
        jwks-ssl-bundle: mcp-internal-ca
